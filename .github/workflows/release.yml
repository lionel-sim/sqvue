name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release branch
        run: |
          git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*'
          release_branches="$(git for-each-ref --format='%(refname:short)' --contains "$GITHUB_SHA" 'refs/remotes/origin/release/*')"
          if [ -z "$release_branches" ]; then
            echo "Release tags must point to a commit contained by a release/* branch."
            exit 1
          fi
          echo "Releasing from: $release_branches"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Create GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
